<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coffee Shop - Barista Display</title>
<style>
  :root {
    --bg: #1e1630;
    --bg-panel: #261d3f;
    --bg-card: #2a2044;
    --text: #ece7f7;
    --text-muted: #b3a5d1;
    --accent: #a684e8;
    --border: #4a3a6e;
    --success-bg: #33265a;
    --success-text: #d8c9f7;
    --success-strong: #c9a6f5;
    --danger-strong: #f08a9c;
    --dot-off: #5a4d78;
  }
  body {
    font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px;
    background: var(--bg); color: var(--text);
  }
  h1, h2 { color: var(--text); }
  h1 { font-size: 1.4rem; }
  .layout { display: flex; gap: 32px; align-items: flex-start; }
  .queue-panel { flex: 2; }
  .side-panel { flex: 1; background: var(--bg-panel); border-radius: 8px; padding: 16px; }
  .order-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; background: var(--bg-card);
  }
  .order-card .details { font-size: 0.95rem; color: var(--text); }
  .order-card .details b { display: block; font-size: 1.05rem; }
  button.complete {
    padding: 8px 14px; cursor: pointer; background: var(--accent); color: #1e1630; border: none; border-radius: 6px; font-weight: 600;
  }
  .empty-state { color: var(--text-muted); font-style: italic; }
  .leaderboard-item { display: flex; justify-content: space-between; padding: 4px 0; color: var(--text); }
  .pickup-panel { margin-top: 20px; }
  .pickup-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px; background: var(--success-bg); margin-bottom: 6px; font-size: 0.9rem; color: var(--text);
  }
  .pickup-item .pickup-label {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pickup-item .pickup-controls { flex-shrink: 0; display: flex; align-items: center; }
  .pickup-item .countdown { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--success-strong); }
  .pickup-item .countdown.expiring-soon { color: var(--danger-strong); }
  button.confirm-pickup {
    padding: 4px 10px; cursor: pointer; background: var(--accent); color: #1e1630; border: none;
    border-radius: 4px; font-weight: 600; font-size: 0.75rem; margin-left: 8px; flex-shrink: 0;
  }
  #status-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--dot-off);
  }
  #status-dot.connected { background: var(--accent); }
  #status-text { color: var(--text-muted); }
  .uc { text-transform: uppercase; }
</style>
</head>
<body>
  <h1>🧑‍🍳 Barista Display <span id="status-dot"></span><span id="status-text" style="font-size:0.8rem; color:#888;">connecting...</span></h1>

  <div class="layout">
    <div class="queue-panel">
      <h2>Order Queue</h2>
      <div id="queue-list"><p class="empty-state">Loading...</p></div>
    </div>

    <div class="side-panel">
      <h2>🔥 Top Sellers Today</h2>
      <div id="leaderboard-list"><p class="empty-state">Loading...</p></div>

      <div class="pickup-panel">
        <h2>🟢 Ready for Pickup</h2>
        <div id="pickup-list"><p class="empty-state">Loading...</p></div>
      </div>
    </div>
  </div>

  <script>
    const queueList = document.getElementById('queue-list');
    const leaderboardList = document.getElementById('leaderboard-list');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    function renderQueue(orders) {
      if (!orders.length) {
        queueList.innerHTML = '<p class="empty-state">No orders in queue.</p>';
        return;
      }
      queueList.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="details">
            <b>#${o.id} - ${o.customer}</b>
            <span class="uc">${o.size} ${o.drink}${o.milk && o.milk !== 'none' ? ' with ' + o.milk + ' milk' : ''}</span>
          </div>
          <button class="complete" data-id="${o.id}">Complete</button>
        </div>
      `).join('');

      queueList.querySelectorAll('button.complete').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          await fetch(`/order/${id}/complete`, { method: 'POST' });
          // The WebSocket order_updates event will trigger a refresh,
          // but refresh immediately too for a snappy UI.
          loadQueue();
        });
      });
    }

    function renderLeaderboard(items) {
      if (!items.length) {
        leaderboardList.innerHTML = '<p class="empty-state">No orders yet.</p>';
        return;
      }
      leaderboardList.innerHTML = items.map((item, i) => `
        <div class="leaderboard-item">
          <span>${i + 1}. <span class="uc">${item.drink}</span></span>
          <span>${item.count}</span>
        </div>
      `).join('');
    }

    async function loadQueue() {
      const res = await fetch('/queue');
      renderQueue(await res.json());
    }

    async function loadLeaderboard() {
      const res = await fetch('/leaderboard');
      renderLeaderboard(await res.json());
    }

    // --- Pickup panel: orders in their "ready for pickup" TTL window ---
    let pickupOrders = [];

    function formatCountdown(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function renderPickup() {
      const pickupList = document.getElementById('pickup-list');
      if (!pickupOrders.length) {
        pickupList.innerHTML = '<p class="empty-state">Nothing waiting for pickup.</p>';
        return;
      }
      pickupList.innerHTML = pickupOrders.map(o => `
        <div class="pickup-item">
          <span class="pickup-label" title="#${o.id} - ${o.customer} (${o.drink})">#${o.id} - ${o.customer} (<span class="uc">${o.drink}</span>)</span>
          <span class="pickup-controls">
            <span class="countdown${o.seconds_remaining <= 60 ? ' expiring-soon' : ''}">${formatCountdown(o.seconds_remaining)}</span>
            <button class="confirm-pickup" data-id="${o.id}">Picked Up</button>
          </span>
        </div>
      `).join('');
      // Note: no per-button addEventListener here on purpose - see the
      // delegated listener attached once, below renderPickup's definition.
      // This panel re-renders every 1s (countdown tick), which would destroy
      // and recreate buttons (and any listeners on them) that often; a click
      // landing mid-re-render would be lost. Delegating to the parent
      // container - which is never destroyed - avoids that race entirely.
    }

    document.getElementById('pickup-list').addEventListener('click', async (e) => {
      const btn = e.target.closest('button.confirm-pickup');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      btn.disabled = true;
      await fetch(`/order/${id}/pickup_confirm`, { method: 'POST' });
      // Optimistic local removal for a snappy UI - the WebSocket event
      // will also trigger a full resync for any other connected screens.
      pickupOrders = pickupOrders.filter(o => o.id !== id);
      renderPickup();
    });

    async function loadPickup() {
      const res = await fetch('/pickup');
      pickupOrders = await res.json();
      renderPickup();
    }

    // Resync with the server every 5s (same cadence as the leaderboard - this
    // panel isn't latency-critical the way the live queue is).
    setInterval(loadPickup, 5000);

    // Tick the displayed countdown down locally every second between resyncs,
    // so it reads as a smooth live timer rather than jumping every 5s.
    setInterval(() => {
      pickupOrders = pickupOrders
        .map(o => ({ ...o, seconds_remaining: o.seconds_remaining - 1 }))
        .filter(o => o.seconds_remaining > 0);
      renderPickup();
    }, 1000);

    // Initial load
    loadQueue();
    loadLeaderboard();
    loadPickup();

    // Leaderboard: light polling every 5s (deliberately not pub/sub - see writeup)
    setInterval(loadLeaderboard, 5000);

    // Queue: live updates via WebSocket <- Redis Pub/Sub bridge on the backend
    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'live';
      };

      ws.onmessage = (event) => {
        // event.data is either a live order event, e.g.
        //   {"event": "new_order", "id": 3}
        // or, in streams mode on first connect, a replayed batch of prior
        // events from orders:stream:
        //   {"event": "history", "count": 7, "entries": [...]}
        let msg = {};
        try { msg = JSON.parse(event.data); } catch (e) { /* ignore */ }

        if (msg.event === 'history') {
          // Replayed history - orders placed before this screen connected.
          // Pub/Sub cannot deliver these; Redis Streams can.
          statusText.textContent = `live (replayed ${msg.count} prior event${msg.count === 1 ? '' : 's'} from stream)`;
        }

        loadQueue();
        loadPickup();
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'reconnecting...';
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = () => ws.close();
    }
    connectWebSocket();
  </script>
</body>
</html>
